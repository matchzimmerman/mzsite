function jd(ms){return ms/86400000+2440587.5}function gmst(ms){const J=jd(ms),T=(J-2451545)/36525;return ((280.46061837+360.98564736629*(J-2451545)+.000387933*T*T-T*T*T/38710000)%360+360)%360}

function draw(){const ms=Date.now();x.fillStyle='#040508';x.fillRect(0,0,W,H);const R=Math.min(W,H)*.48;x.strokeStyle='rgba(222,219,207,.045)';x.beginPath();x.arc(W/2,H/2,R,0,TAU);x.stroke();for(const s of faint){const h=horiz(s.ra,s.dec,ms),p=proj(h.alt,h.az);if(!p)continue;x.globalAlpha=clamp((5.9-s.mag)*.085,.03,.15);x.fillStyle='#dedbcf';x.fillRect(p.x|0,p.y|0,1,1)}x.globalAlpha=1;const points={};for(const [name,v] of Object.entries(stars)){const h=horiz(v[0],v[1],ms),p=proj(h.alt,h.az);points[name]=p;if(!p)continue;const size=v[2]<.35?2:1;x.globalAlpha=clamp(.9-v[2]*.1,.32,.95);x.fillStyle='#e5e2d6';x.fillRect(p.x|0,p.y|0,size,size)}x.globalAlpha=1;for(const con of constellations){let visible=0,cx=0,cy=0;for(const [a,b] of con.edges){const p=points[a],q=points[b];if(!p||!q)continue;visible++;cx+=(p.x+q.x)/2;cy+=(p.y+q.y)/2;x.globalAlpha=.095;x.strokeStyle='#d8d4c8';x.lineWidth=1;x.beginPath();x.moveTo(Math.round(p.x)+.5,Math.round(p.y)+.5);x.lineTo(Math.round(q.x)+.5,Math.round(q.y)+.5);x.stroke()}if(visible>=2){x.globalAlpha=.14;x.fillStyle='#d8d4c8';x.font='5px monospace';x.fillText(con.name,(cx/visible)|0,(cy/visible)|0)}}x.globalAlpha=1;x.globalAlpha=.14;x.font='6px monospace';x.fillStyle='#dedbcf';x.fillText('MZTV / NIGHT FIELD / v0.0.3',8,11);x.globalAlpha=1;clock.textContent=new Intl.DateTimeFormat('en-US',{timeZone:observer.tz,hour:'numeric',minute:'2-digit',second:'2-digit'}).format(new Date(ms));requestAnimationFrame(draw)}requestAnimationFrame(draw);
