<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MZTV // NIGHT FIELD</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040508;color:#d7d4c8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}#gate{position:fixed;inset:0;display:grid;place-items:center;background:#040508dd;z-index:3;cursor:pointer;text-transform:uppercase;letter-spacing:.14em}#gate div{border:1px solid #d7d4c855;padding:20px 24px;font-size:12px;line-height:1.7;text-align:center}#hud{position:fixed;left:16px;bottom:14px;font-size:9px;line-height:1.5;letter-spacing:.1em;text-transform:uppercase;opacity:.5;z-index:2}</style></head><body><canvas id="c"></canvas><div id="hud">MZTV // NIGHT FIELD<br>continuous generative transmission<br><span id="state">audio: sleeping</span></div><div id="gate"><div>MZTV // NIGHT FIELD<br><br>enter transmission<br><span style="opacity:.55">432-reference sleep field</span></div></div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),g=document.getElementById('gate'),state=document.getElementById('state'),W=320,H=180,T=Math.PI*2;c.width=W;c.height=H;x.imageSmoothingEnabled=false;const r=(a,b)=>a+Math.random()*(b-a),stars=Array.from({length:260},()=>({a:r(0,T),rr:Math.pow(Math.random(),.65)*165+8,z:r(.2,1),s:Math.random()<.08?2:1,p:r(0,T),tw:r(.1,.6)})),maps=Array.from({length:14},(_,i)=>({a:r(0,T),span:r(.07,.14),n:3+Math.floor(Math.random()*4),id:'NF-'+String(i+1).padStart(2,'0')}));let t0=performance.now();function draw(n){const t=(n-t0)/1000,rot=t*T/(18*60);x.fillStyle='#040508';x.fillRect(0,0,W,H);const pts=[];for(const s of stars){const a=s.a+rot,px=W/2+Math.cos(a)*s.rr,py=H*.54+Math.sin(a)*s.rr*.5;if(px<0||px>W||py<0||py>H){pts.push(null);continue}x.globalAlpha=(.35+s.z*.6)*(.7+.3*Math.sin(t*s.tw+s.p));x.fillStyle='#ddd9cc';x.fillRect(px|0,py|0,s.s,s.s);pts.push({x:px,y:py})}x.globalAlpha=1;for(const m of maps){const a=(m.a+rot)%T,d=Math.atan2(Math.sin(a-1.5*Math.PI),Math.cos(a-1.5*Math.PI)),vis=Math.max(0,1-Math.abs(d)/.7);if(!vis)continue;const cand=[];stars.forEach((s,i)=>{if(!pts[i])return;const sd=Math.abs(Math.atan2(Math.sin(s.a-m.a),Math.cos(s.a-m.a)));if(sd<m.span)cand.push({i,sd})});cand.sort((a,b)=>a.sd-b.sd);const q=cand.slice(0,m.n);if(q.length<3)continue;x.globalAlpha=.14*vis;x.strokeStyle='#c9c5b9';x.beginPath();x.moveTo(pts[q[0].i].x,pts[q[0].i].y);for(let j=1;j<q.length;j++)x.lineTo(pts[q[j].i].x,pts[q[j].i].y);x.stroke();x.globalAlpha=.25*vis;x.font='5px monospace';x.fillStyle='#c9c5b9';const p=pts[q[(q.length/2)|0].i];x.fillText(m.id,p.x+4,p.y-4)}x.globalAlpha=.18;x.font='6px monospace';x.fillStyle='#ddd9cc';x.fillText('MZTV / NIGHT FIELD / v0.0.1',8,11);x.globalAlpha=1;requestAnimationFrame(draw)}requestAnimationFrame(draw);let ac,master,voices=[],started=false;const A=432,base=A/8,rat=[1,4/3,3/2,2,9/8,5/4];function voice(f,l,pan,rate){const o=ac.createOscillator(),gn=ac.createGain(),p=ac.createStereoPanner(),lf=ac.createOscillator(),lg=ac.createGain();o.type=Math.random()<.8?'sine':'triangle';o.frequency.value=f;gn.gain.value=l;p.pan.value=pan;lf.frequency.value=rate;lg.gain.value=l*.25;lf.connect(lg).connect(gn.gain);o.connect(gn).connect(p).connect(master);o.start();lf.start();voices.push({o,p})}function noise(){const b=ac.createBuffer(1,ac.sampleRate*6,ac.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){last=(last+.015*(Math.random()*2-1))/1.015;d[i]=last*2.6}const s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain();s.buffer=b;s.loop=true;f.type='lowpass';f.frequency.value=520;gn.gain.value=.015;s.connect(f).connect(gn).connect(master);s.start()}async function start(){if(started)return;started=true;ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.0001;const comp=ac.createDynamicsCompressor();comp.threshold.value=-28;comp.knee.value=20;comp.ratio.value=2.5;comp.attack.value=.1;comp.release.value=2;master.connect(comp).connect(ac.destination);voice(base,.035,-.3,.005);voice(base*2,.02,.25,.0037);voice(base*1.5,.016,-.1,.0027);voice(base*4/3,.011,.4,.0019);noise();master.gain.exponentialRampToValueAtTime(.42,ac.currentTime+20);setInterval(()=>{const v=voices[(Math.random()*voices.length)|0],target=base*rat[(Math.random()*rat.length)|0]*(Math.random()<.15?2:1),now=ac.currentTime;v.o.frequency.cancelScheduledValues(now);v.o.frequency.setValueAtTime(v.o.frequency.value,now);v.o.frequency.exponentialRampToValueAtTime(target,now+r(40,100));v.p.pan.linearRampToValueAtTime(r(-.55,.55),now+r(50,120))},30000);state.textContent='audio: live / A=432 reference'}g.onclick=async()=>{await start();g.style.display='none'};})();</script></body></html>
